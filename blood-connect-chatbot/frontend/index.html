<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Connect Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Chat widget button */
    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    /* Chat window */
    #chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      max-height: 500px;
      display: none;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      background-color: white;
      z-index: 999;
      border: 1px solid #ccc;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .message {
      padding: 8px 12px;
      border-radius: 10px;
      margin: 5px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: #dcf8c6;
      align-self: flex-end;
    }

    .bot {
      background: #eee;
      align-self: flex-start;
    }

    #input-form {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 8px;
      background: #fafafa;
    }

    #user-input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #send-btn {
      padding: 8px 12px;
      font-size: 14px;
      margin-left: 6px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .reply {
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: #e0e0e0;
      margin: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

<!-- Toggle button -->
<button id="chat-toggle">💬</button>

<!-- Chat container -->
<div id="chat-container">
  <div id="chat-box"></div>
  <form id="input-form">
    <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
  const toggleBtn = document.getElementById("chat-toggle");
  const chatContainer = document.getElementById("chat-container");
  const chatBox = document.getElementById("chat-box");
  const form = document.getElementById("input-form");
  const input = document.getElementById("user-input");

  let initialized = false;

  toggleBtn.onclick = () => {
    chatContainer.style.display = chatContainer.style.display === "flex" ? "none" : "flex";
    if (!initialized) {
      setTimeout(() => {
        addMessage("Hi! I’m the Blood Connect Assistant. What would you like to do?", "bot");
        addQuickReplies(["Donate Blood", "Request Blood", "Organize Camp"]);
        initialized = true;
      }, 200);
    }
  };

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `message ${type}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addQuickReplies(options) {
    options.forEach(option => {
      const btn = document.createElement("button");
      btn.className = "reply";
      btn.innerText = option;
      btn.onclick = () => {
        input.value = option;
        form.dispatchEvent(new Event("submit"));
      };
      chatBox.appendChild(btn);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";

    const res = await fetch("http://127.0.0.1:8000/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    addMessage(data.reply, "bot");

    document.querySelectorAll("button.reply").forEach(btn => btn.remove());
    if (data.quick_replies) addQuickReplies(data.quick_replies);
  };
</script>
</body>
</html>
